syntax = "proto3";

package dfl;

service RingTransfer {
  rpc SendModel (ModelPayload) returns (ModelAck);
}

message ModelPayload {
  string originator_id       = 1;
  int32  round               = 2;
  int32  hop                 = 3;
  int32  ttl                 = 4;
  bytes  data                = 5;
  repeated string dead_nodes = 6;
}

message ModelAck {
  string receiver_id = 1;
  string status      = 2;
}