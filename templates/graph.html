<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Visualization - DFL Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    padding: 30px;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { 
    font-size: 1.8rem; 
    margin-bottom: 25px; 
    color: #38bdf8;
    text-align: center;
    text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
  }
  .card {
    background: rgba(30, 41, 59, 0.8);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    border: 1px solid rgba(51, 65, 85, 0.5);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .card h2 {
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #94a3b8;
    margin-bottom: 20px;
    border-bottom: 1px solid #334155;
    padding-bottom: 10px;
  }
  .stats-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat-item {
    background: rgba(15, 23, 42, 0.5);
    padding: 15px 25px;
    border-radius: 10px;
    border: 1px solid rgba(51, 65, 85, 0.3);
  }
  .stat-label { color: #94a3b8; font-size: 0.85rem; margin-bottom: 5px; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
  .stat-value.good { color: #4ade80; }
  .stat-value.bad { color: #f87171; }
  #graph-container {
    width: 100%;
    height: 500px;
    background: rgba(15, 23, 42, 0.3);
    border-radius: 10px;
    border: 1px solid rgba(51, 65, 85, 0.3);
    position: relative;
    overflow: hidden;
  }
  .legend {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 15px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .legend-color {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #38bdf8;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="container">
    <h1>🔗 Graph Visualization</h1>
    
    <div class="card">
      <h2>Network Statistics</h2>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-label">Total Nodes</div>
          <div class="stat-value" id="total-nodes">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Is K-Regular</div>
          <div class="stat-value" id="k-regular">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Min Degree</div>
          <div class="stat-value" id="min-degree">—</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Max Degree</div>
          <div class="stat-value" id="max-degree">—</div>
        </div>
      </div>
    </div>
    
    <div class="card">
      <h2>Graph View</h2>
      <div id="graph-container"></div>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-color" style="background: #38bdf8;"></div>
          <span>Node</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #facc15;"></div>
          <span>Bootstrap</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #4ade80;"></div>
          <span>Edge</span>
        </div>
      </div>
    </div>
    
    <a href="/" class="back-link">← Back to Dashboard</a>
  </div>

  <script>
    async function loadGraph() {
      try {
        const response = await fetch('/graph');
        const data = await response.json();
        
        document.getElementById('total-nodes').textContent = data.adjacency ? Object.keys(data.adjacency).length : 0;
        document.getElementById('k-regular').textContent = data.is_k_regular ? '✓ Yes' : '✗ No';
        
        const degrees = Object.values(data.degrees || {});
        const minDeg = Math.min(...degrees);
        const maxDeg = Math.max(...degrees);
        document.getElementById('min-degree').textContent = minDeg;
        document.getElementById('max-degree').textContent = maxDeg;
        
        // Simple text-based graph visualization
        const container = document.getElementById('graph-container');
        container.innerHTML = '<pre style="font-family: SF Mono, Fira Code, monospace; font-size: 0.85rem; line-height: 1.6; padding: 20px; max-height: 460px; overflow-y: auto;">' + 
          JSON.stringify(data.adjacency, null, 2) + '</pre>';
      } catch (err) {
        console.error('Failed to load graph:', err);
      }
    }
    
    loadGraph();
    setInterval(loadGraph, 5000);
  </script>
</body>
</html>
